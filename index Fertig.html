<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор раскладок клавиатуры</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #111;
        --panel-strong: #1a1a1a;
        --key: #111;
        --key-hover: #1a1a1a;
        --key-active: #2a2a2a;
        --line: #444;
        --line-soft: #444;
        --text: #aaa;
        --muted: #cfcfcf;
        --quiet: #999;
        --accent: #ccc;
        --accent-2: #ccc;
        --danger: #ccc;
        --key-height: 84px;
        --key-gap: 24px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 1180px;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Display", "SF Pro Text", "SF Compact Display", "SF Compact Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        width: min(1920px, 100%);
        margin: 0 auto;
        padding: 28px 34px 36px;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(340px, 1fr) auto;
        gap: 28px;
        align-items: end;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 720px;
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .segmented,
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--panel);
      }

      .mode-btn,
      .tool-btn {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease, transform 140ms ease;
      }

      .mode-btn {
        min-width: 54px;
        padding: 0 14px;
        font-weight: 700;
      }

      .tool-btn {
        min-width: 40px;
        padding: 0 11px;
        font-size: 17px;
      }

      .mode-btn:hover,
      .tool-btn:hover {
        background: #2a2a2a;
        color: var(--text);
      }

      .mode-btn.active,
      .tool-btn.active {
        background: #ccc;
        color: #000;
      }

      .tool-btn:active,
      .mode-btn:active {
        transform: translateY(1px);
      }

      .keyboard-wrap {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111;
      }

      .hands {
        position: absolute;
        inset: 0;
        z-index: 2;
        opacity: 0.22;
        filter: brightness(1.4);
        pointer-events: none;
      }

      .hands-image {
        display: block;
        position: absolute;
        height: auto;
      }

      .hands-image.left {
        left: 4.8%;
        top: 32.2%;
        width: 42%;
        transform: scaleX(-1);
      }

      .hands-image.right {
        right: 11.4%;
        top: 32.2%;
        width: 42%;
      }

      .keyboard {
        position: relative;
        z-index: 1;
        display: grid;
        column-gap: 0;
        row-gap: var(--key-gap);
        grid-auto-rows: var(--key-height);
        grid-template-columns: repeat(72, 1fr);
        padding: 32px 28px 30px;
      }

      .key {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: var(--key-height);
        min-height: 0;
        margin: 0;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--key);
        color: var(--text);
        cursor: pointer;
        user-select: none;
        box-shadow: none;
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }

      .key:hover {
        border-color: var(--line);
        background: var(--key-hover);
      }

      .key.selected {
        border-color: var(--line);
        box-shadow: none;
      }

      .key.home::after {
        content: "";
        position: absolute;
        bottom: 16px;
        left: 50%;
        width: 16px;
        height: 2px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: currentColor;
        opacity: 0.82;
      }

      .label {
        width: 100%;
        padding: 0 8px;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: clamp(16px, 1.45vw, 31px);
        font-weight: 400;
        letter-spacing: 0;
      }

      .key.function .label {
        padding: 0 4px;
        color: var(--text);
        font-size: clamp(11px, 0.89vw, 18px);
        font-weight: 520;
        text-transform: lowercase;
      }

      .key.iso .label {
        white-space: pre-line;
        line-height: 1.58;
      }

      .key.stacked .label {
        white-space: pre-line;
        line-height: 1.66;
        font-size: clamp(15px, 1.18vw, 24px);
      }

      .key.dim {
        color: var(--quiet);
      }

      .key.align-left {
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 14px 12px;
      }

      .key.align-left .label {
        text-align: left;
      }

      .key.align-right {
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 14px 12px;
      }

      .key.align-right .label {
        text-align: right;
      }

      .key[data-key="control"],
      .key[data-key="optionLeft"],
      .key[data-key="commandLeft"],
      .key[data-key="commandRight"],
      .key[data-key="optionRight"] {
        align-items: flex-end;
        padding: 0 12px 12px;
      }

      .key-enter {
        position: relative;
        align-self: stretch;
        height: 100%;
        min-height: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0;
      }

      .key-enter:hover {
        background: transparent;
      }

      .key-enter.selected {
        box-shadow: none;
      }

      .key-enter svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .key-enter .enter-shape {
        fill: var(--key);
        stroke: var(--line);
        stroke-width: 2.2;
        vector-effect: non-scaling-stroke;
      }

      .key-enter:hover .enter-shape {
        fill: var(--key-hover);
        stroke: var(--line);
      }

      .key-enter.selected .enter-shape {
        stroke: var(--line);
      }

      .key-enter .label {
        position: relative;
        z-index: 1;
        width: auto;
        margin: 0 18px 26px 0;
        padding: 0;
        font-size: clamp(23px, 1.8vw, 36px);
      }

      .key-enter .enter-symbol {
        position: absolute;
        left: 69%;
        top: 32%;
        z-index: 1;
        color: var(--text);
        font-size: clamp(23px, 1.8vw, 36px);
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .editor {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 220px 170px;
        gap: 12px;
        align-items: end;
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--panel);
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field span {
        color: var(--muted);
        font-size: 13px;
      }

      .field input,
      .field select {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #111;
        color: var(--text);
        padding: 0 12px;
        outline: 0;
      }

      .field input:focus,
      .field select:focus {
        border-color: var(--line);
        box-shadow: none;
      }

      .apply-btn {
        height: 42px;
        border: 0;
        border-radius: 7px;
        background: #ccc;
        color: #000;
        cursor: pointer;
        font-weight: 800;
      }

      .status {
        margin-top: 11px;
        min-height: 20px;
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 1300px) {
        body {
          min-width: 980px;
        }

        .app {
          padding: 20px;
        }

        .topbar {
          grid-template-columns: 1fr;
          gap: 16px;
        }

        .controls {
          justify-content: flex-start;
        }

        .keyboard {
          --key-height: 68px;
          padding: 30px 24px 28px;
        }

        .key {
          height: var(--key-height);
        }

      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Редактор раскладок</h1>
          <p class="subtitle">Выберите язык, нажмите на клавишу и поменяйте ее подпись. Изменения сохраняются отдельно для каждой раскладки прямо в браузере.</p>
        </div>

        <div class="controls" aria-label="Управление раскладками">
          <div class="segmented" id="languageTabs" role="tablist" aria-label="Язык клавиатуры"></div>
          <div class="toolbar" aria-label="Инструменты">
            <button class="tool-btn active" id="editToggle" type="button" title="Редактировать клавиши" aria-pressed="true">✎</button>
            <button class="tool-btn" id="resetLayout" type="button" title="Сбросить текущую раскладку">↺</button>
          </div>
        </div>
      </header>

      <section class="keyboard-wrap" aria-label="Клавиатура">
        <div class="hands" aria-hidden="true">
          <img class="hands-image left" src="hands.svg" alt="">
          <img class="hands-image right" src="hands.svg" alt="">
        </div>
        <div class="keyboard" id="keyboard"></div>
      </section>

      <section class="editor" aria-label="Редактор выбранной клавиши">
        <label class="field">
          <span>Выбранная клавиша</span>
          <select id="keySelect"></select>
        </label>
        <label class="field">
          <span>Подпись</span>
          <input id="labelInput" type="text" maxlength="18" autocomplete="off" placeholder="Например: Ж">
        </label>
        <button class="apply-btn" id="applyLabel" type="button">Применить</button>
      </section>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      const storageKey = "keyboard-layout-editor-v1";
      const languages = {
        de: {
          name: "DE",
          keys: {
            backquote: "°\n^", digit1: "!\n1", digit2: "\"\n2", digit3: "§\n3", digit4: "$\n4", digit5: "%\n5", digit6: "&\n6", digit7: "/\n7", digit8: "(\n8", digit9: ")\n9", digit0: "=\n0", minus: "?\nß", equal: "`\n´", delete: "delete",
            tab: "tab", q: "Q", w: "W", e: "E", r: "R", t: "T", y: "Z", u: "U", i: "I", o: "O", p: "P", bracketLeft: "Ü", bracketRight: "*\n+", backslash: "'\n#",
            caps: "caps lock", a: "A", s: "S", d: "D", f: "F", g: "G", h: "H", j: "J", k: "K", l: "L", semicolon: "Ö", quote: "Ä", enter: "↵",
            shiftLeft: "shift", isoIntl: ">\n<", z: "Y", x: "X", c: "C", v: "V", b: "B", n: "N", m: "M", comma: ";\n,", period: ":\n.", slash: "_\n-", shiftRight: "shift",
            fn: "fn", control: "control", optionLeft: "option", commandLeft: "command", space: "", commandRight: "command", optionRight: "option", arrowLeft: "◂", arrowUp: "▴", arrowDown: "▾", arrowRight: "▸"
          }
        },
        en: {
          name: "EN",
          keys: {
            backquote: "~\n`", digit1: "!\n1", digit2: "@\n2", digit3: "#\n3", digit4: "$\n4", digit5: "%\n5", digit6: "^\n6", digit7: "&\n7", digit8: "*\n8", digit9: "(\n9", digit0: ")\n0", minus: "_\n-", equal: "+\n=", delete: "delete",
            tab: "tab", q: "Q", w: "W", e: "E", r: "R", t: "T", y: "Y", u: "U", i: "I", o: "O", p: "P", bracketLeft: "[", bracketRight: "]", backslash: "\\",
            caps: "caps lock", a: "A", s: "S", d: "D", f: "F", g: "G", h: "H", j: "J", k: "K", l: "L", semicolon: ";", quote: "'", enter: "↵",
            shiftLeft: "shift", isoIntl: ">\n<", z: "Z", x: "X", c: "C", v: "V", b: "B", n: "N", m: "M", comma: ",", period: ".", slash: "/", shiftRight: "shift",
            fn: "fn", control: "control", optionLeft: "option", commandLeft: "command", space: "", commandRight: "command", optionRight: "option", arrowLeft: "◂", arrowUp: "▴", arrowDown: "▾", arrowRight: "▸"
          }
        },
        ru: {
          name: "RU",
          keys: {
            backquote: "Ё", digit1: "!\n1", digit2: "\"\n2", digit3: "№\n3", digit4: ";\n4", digit5: "%\n5", digit6: ":\n6", digit7: "?\n7", digit8: "*\n8", digit9: "(\n9", digit0: ")\n0", minus: "_\n-", equal: "+\n=", delete: "delete",
            tab: "tab", q: "Й", w: "Ц", e: "У", r: "К", t: "Е", y: "Н", u: "Г", i: "Ш", o: "Щ", p: "З", bracketLeft: "Х", bracketRight: "Ъ", backslash: "\\",
            caps: "caps lock", a: "Ф", s: "Ы", d: "В", f: "А", g: "П", h: "Р", j: "О", k: "Л", l: "Д", semicolon: "Ж", quote: "Э", enter: "↵",
            shiftLeft: "shift", isoIntl: ">\n<", z: "Я", x: "Ч", c: "С", v: "М", b: "И", n: "Т", m: "Ь", comma: "Б", period: "Ю", slash: ".", shiftRight: "shift",
            fn: "fn", control: "control", optionLeft: "option", commandLeft: "command", space: "", commandRight: "command", optionRight: "option", arrowLeft: "◂", arrowUp: "▴", arrowDown: "▾", arrowRight: "▸"
          }
        }
      };

      const geometry = [
        ["backquote", 1, 1, 4, "stacked"], ["digit1", 1, 6, 4, "stacked"], ["digit2", 1, 11, 4, "stacked"], ["digit3", 1, 16, 4, "stacked"], ["digit4", 1, 21, 4, "stacked"], ["digit5", 1, 26, 4, "stacked"], ["digit6", 1, 31, 4, "stacked"], ["digit7", 1, 36, 4, "stacked"], ["digit8", 1, 41, 4, "stacked"], ["digit9", 1, 46, 4, "stacked"], ["digit0", 1, 51, 4, "stacked"], ["minus", 1, 56, 4, "stacked"], ["equal", 1, 61, 4, "stacked"], ["delete", 1, 66, 7, "function align-right"],
        ["tab", 2, 1, 7, "function align-left"], ["q", 2, 9, 4], ["w", 2, 14, 4], ["e", 2, 19, 4], ["r", 2, 24, 4], ["t", 2, 29, 4], ["y", 2, 34, 4], ["u", 2, 39, 4], ["i", 2, 44, 4], ["o", 2, 49, 4], ["p", 2, 54, 4], ["bracketLeft", 2, 59, 4], ["bracketRight", 2, 64, 4, "stacked"],
        ["caps", 3, 1, 8, "function align-left"], ["a", 3, 10, 4], ["s", 3, 15, 4], ["d", 3, 20, 4], ["f", 3, 25, 4, "home"], ["g", 3, 30, 4], ["h", 3, 35, 4], ["j", 3, 40, 4, "home"], ["k", 3, 45, 4], ["l", 3, 50, 4], ["semicolon", 3, 55, 4], ["quote", 3, 60, 4], ["backslash", 3, 65, 4, "stacked"], ["enter", 2, 69, 4, "function key-enter", 2],
        ["shiftLeft", 4, 1, 5, "function align-left"], ["isoIntl", 4, 7, 4, "iso"], ["z", 4, 12, 4], ["x", 4, 17, 4], ["c", 4, 22, 4], ["v", 4, 27, 4], ["b", 4, 32, 4], ["n", 4, 37, 4], ["m", 4, 42, 4], ["comma", 4, 47, 4, "stacked"], ["period", 4, 52, 4, "stacked"], ["slash", 4, 57, 4, "stacked"], ["shiftRight", 4, 62, 11, "function align-right"],
        ["fn", 5, 1, 4, "function align-left"], ["control", 5, 6, 4, "function"], ["optionLeft", 5, 11, 4, "function"], ["commandLeft", 5, 16, 5, "function"], ["space", 5, 22, 25], ["commandRight", 5, 48, 5, "function"], ["optionRight", 5, 54, 4, "function"], ["arrowLeft", 5, 59, 4, "function"], ["arrowUp", 5, 64, 4, "function"], ["arrowDown", 5, 64, 4, "function"], ["arrowRight", 5, 69, 4, "function"]
      ];

      const keyboard = document.querySelector("#keyboard");
      const languageTabs = document.querySelector("#languageTabs");
      const keySelect = document.querySelector("#keySelect");
      const labelInput = document.querySelector("#labelInput");
      const applyLabel = document.querySelector("#applyLabel");
      const editToggle = document.querySelector("#editToggle");
      const resetLayout = document.querySelector("#resetLayout");
      const status = document.querySelector("#status");

      let saved = loadSaved();
      let currentLanguage = saved.currentLanguage || "de";
      let selectedKey = "a";
      let editMode = true;

      function loadSaved() {
        try {
          return JSON.parse(localStorage.getItem(storageKey)) || {};
        } catch {
          return {};
        }
      }

      function persist() {
        localStorage.setItem(storageKey, JSON.stringify(saved));
      }

      function labelsFor(language) {
        return { ...languages[language].keys, ...(saved[language] || {}) };
      }

      function keyTitle(id) {
        return id.replace(/([A-Z])/g, " $1").replace(/^./, letter => letter.toUpperCase());
      }

      function setStatus(message) {
        status.textContent = message;
        clearTimeout(setStatus.timer);
        setStatus.timer = setTimeout(() => {
          status.textContent = "";
        }, 2600);
      }

      function renderTabs() {
        languageTabs.innerHTML = "";
        Object.entries(languages).forEach(([id, language]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `mode-btn${id === currentLanguage ? " active" : ""}`;
          button.textContent = language.name;
          button.setAttribute("role", "tab");
          button.setAttribute("aria-selected", String(id === currentLanguage));
          button.addEventListener("click", () => {
            currentLanguage = id;
            saved.currentLanguage = id;
            persist();
            render();
          });
          languageTabs.append(button);
        });
      }

      function renderKeyboard() {
        const labels = labelsFor(currentLanguage);
        keyboard.innerHTML = "";
        geometry.forEach(([id, row, column, span, extra = "", rowSpan = 1]) => {
          const key = document.createElement("button");
          key.type = "button";
          key.className = `key ${extra}${id === selectedKey ? " selected" : ""}`.trim();
          key.dataset.key = id;
          key.style.gridColumn = `${column} / span ${span}`;
          key.style.gridRow = `${row} / span ${rowSpan}`;
          if (id === "arrowUp" || id === "arrowDown") {
            key.style.height = "calc((var(--key-height) - var(--key-gap)) / 2)";
            key.style.alignSelf = id === "arrowUp" ? "start" : "end";
          }

          if (id === "enter") {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");
            svg.setAttribute("aria-hidden", "true");

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("class", "enter-shape");
            path.setAttribute("d", "M7 1 H93 Q99 1 99 7 V93 Q99 99 93 99 H35 Q29 99 29 93 V47 Q29 44 26 44 H7 Q1 44 1 38 V7 Q1 1 7 1 Z");
            svg.append(path);

            const symbol = document.createElement("span");
            symbol.setAttribute("class", "enter-symbol");
            symbol.textContent = labels[id] ?? "";
            key.append(svg);
            key.append(symbol);
          }

          const label = document.createElement("span");
          label.className = "label";
          label.textContent = id === "enter" ? "" : labels[id] ?? "";
          key.append(label);
          key.setAttribute("aria-label", `${keyTitle(id)}: ${labels[id] || "пусто"}`);
          key.addEventListener("click", () => selectKey(id));
          keyboard.append(key);
        });
      }

      function renderSelect() {
        keySelect.innerHTML = "";
        geometry.forEach(([id]) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = keyTitle(id);
          keySelect.append(option);
        });
        keySelect.value = selectedKey;
      }

      function selectKey(id) {
        selectedKey = id;
        const labels = labelsFor(currentLanguage);
        keySelect.value = id;
        labelInput.value = labels[id] ?? "";
        renderKeyboard();
        if (editMode) {
          labelInput.focus();
          labelInput.select();
        }
      }

      function applyCurrentLabel() {
        const value = labelInput.value.trim();
        saved[currentLanguage] = saved[currentLanguage] || {};
        const baseValue = languages[currentLanguage].keys[selectedKey] ?? "";

        if (value === baseValue) {
          delete saved[currentLanguage][selectedKey];
        } else {
          saved[currentLanguage][selectedKey] = value;
        }

        persist();
        renderKeyboard();
        setStatus(`Клавиша "${keyTitle(selectedKey)}" обновлена для ${languages[currentLanguage].name}.`);
      }

      function render() {
        renderTabs();
        renderKeyboard();
        renderSelect();
        selectKey(selectedKey);
      }

      keySelect.addEventListener("change", event => selectKey(event.target.value));
      applyLabel.addEventListener("click", applyCurrentLabel);
      labelInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          applyCurrentLabel();
        }
      });

      editToggle.addEventListener("click", () => {
        editMode = !editMode;
        editToggle.classList.toggle("active", editMode);
        editToggle.setAttribute("aria-pressed", String(editMode));
        document.querySelector(".editor").style.display = editMode ? "grid" : "none";
      });

      resetLayout.addEventListener("click", () => {
        delete saved[currentLanguage];
        persist();
        render();
        setStatus(`Раскладка ${languages[currentLanguage].name} сброшена.`);
      });

      render();
    </script>
  </body>
</html>
