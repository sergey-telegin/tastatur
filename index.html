<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор раскладок клавиатуры</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle"></h1>
        <button class="settings-btn" id="settingsToggle" type="button" aria-label="Настройки">
          <span class="settings-icon" aria-hidden="true">⚙️</span>
        </button>
      </header>

      <section class="trainer" aria-label="Текст для печати">
        <div class="practice-stats" aria-label="Статистика печати">
          <div class="practice-stat">
            <span class="practice-stat-label" id="practiceAccuracyLabel">Точность</span>
            <span class="practice-stat-value" id="practiceAccuracyValue">100%</span>
          </div>
          <div class="practice-stat">
            <span class="practice-stat-label" id="practiceSpeedLabel">Скорость</span>
            <span class="practice-stat-value" id="practiceSpeedValue">0 зн/мин</span>
          </div>
        </div>
        <div class="practice-sample" id="practiceSample"></div>
        <input class="practice-input" id="practiceInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ввод текста">
      </section>

      <div class="keyboard-scale" id="keyboardScale">
        <section class="keyboard-wrap" id="keyboardWrap" aria-label="Клавиатура">
          <div class="hands" id="handsLayer" aria-label="Пальцы">
            <div class="hand left">
              <img class="finger full" data-finger="left-pinky" src="assets/fingers/left-pinky.svg" alt="">
              <img class="finger full" data-finger="left-ring" src="assets/fingers/left-ring.svg" alt="">
              <img class="finger full" data-finger="left-middle" src="assets/fingers/left-middle.svg" alt="">
              <img class="finger left-index" data-finger="left-index" src="assets/fingers/left-index.svg" alt="">
              <img class="finger left-thumb" data-finger="left-thumb" src="assets/fingers/left-thumb.svg" alt="">
            </div>
            <div class="hand right">
              <img class="finger full" data-finger="right-pinky" src="assets/fingers/right-pinky.svg" alt="">
              <img class="finger full" data-finger="right-ring" src="assets/fingers/right-ring.svg" alt="">
              <img class="finger full" data-finger="right-middle" src="assets/fingers/right-middle.svg" alt="">
              <img class="finger right-index" data-finger="right-index" src="assets/fingers/right-index.svg" alt="">
              <img class="finger right-thumb" data-finger="right-thumb" src="assets/fingers/right-thumb.svg" alt="">
            </div>
          </div>
          <div class="keyboard" id="keyboard"></div>
          <div class="keyboard-finger-picker" id="keyboardFingerPicker" aria-label="Выбор пальца"></div>
        </section>
      </div>

      <section class="keyboard-editor-panel" id="keyboardEditorPanel" aria-live="polite">
        <div class="keyboard-editor-actions">
          <div class="keyboard-editor-actions-left">
            <button class="ghost-btn keyboard-editor-reset" id="keyboardEditorReset" type="button">Вернуть настройки по умолчанию</button>
            <button class="secondary-btn keyboard-editor-toggle" id="keyboardEditorShowAll" type="button">Показать все пальцы</button>
          </div>
          <div class="keyboard-editor-actions-right">
            <button class="ghost-btn" id="keyboardEditorCancel" type="button">Отменить</button>
            <button class="apply-btn" id="keyboardEditorSave" type="button">Сохранить</button>
          </div>
        </div>
      </section>

      <section class="editor" aria-label="Редактор выбранной клавиши">
        <label class="field">
          <span>Выбранная клавиша</span>
          <select id="keySelect"></select>
        </label>
        <label class="field">
          <span>Подпись</span>
          <input id="labelInput" type="text" maxlength="18" autocomplete="off" placeholder="Например: Ж">
        </label>
        <button class="apply-btn" id="applyLabel" type="button">Применить</button>
      </section>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsTitle">
      <div class="settings-panel">
        <div class="settings-head">
          <h2 class="settings-title" id="settingsTitle">Настройки</h2>
          <button class="settings-close" id="settingsClose" type="button" aria-label="Закрыть">×</button>
        </div>

        <div class="settings-group">
          <span class="settings-label" id="languageLabel">Язык</span>
          <div class="segmented" id="languageTabs" role="tablist" aria-label="Язык клавиатуры"></div>
        </div>

        <div class="settings-group">
          <span class="settings-label" id="moduleLabel">Модуль</span>
          <div class="module-list" id="practiceModuleList"></div>
        </div>

        <div class="settings-group">
          <span class="settings-label" id="fingerMapSectionLabel">Карта пальцев</span>
          <button class="nav-btn" id="fingerMapOpen" type="button">Открыть карту пальцев</button>
        </div>

        <div class="toolbar" aria-label="Инструменты">
          <button class="tool-btn active" id="editToggle" type="button" title="Редактировать клавиши" aria-pressed="true">✎</button>
          <button class="tool-btn" id="resetLayout" type="button" title="Сбросить текущую раскладку">↺</button>
        </div>

      </div>
    </dialog>

    <dialog class="settings-dialog finger-map-dialog" id="fingerMapDialog" aria-labelledby="fingerMapTitle">
      <div class="settings-panel finger-map-layout">
        <div class="settings-head">
          <h2 class="settings-title" id="fingerMapTitle">Карта пальцев</h2>
          <div class="settings-head-actions">
            <button class="secondary-btn" id="fingerMapKeyboardMode" type="button">Режим клавиатуры</button>
            <button class="settings-close" id="fingerMapClose" type="button" aria-label="Закрыть">×</button>
          </div>
        </div>

        <p class="finger-map-help" id="fingerMapHelp">Выберите палец, чтобы подсветить его клавиши на клавиатуре.</p>
        <div class="finger-map-list" id="fingerMapList" aria-live="polite"></div>
        <div class="dialog-actions finger-map-actions">
          <button class="ghost-btn finger-map-reset" id="fingerMapReset" type="button">Вернуть настройки по умолчанию</button>
          <div class="finger-map-actions-right">
            <button class="ghost-btn" id="fingerMapCancel" type="button">Отменить</button>
            <button class="apply-btn" id="fingerMapSave" type="button">Сохранить</button>
          </div>
        </div>
      </div>
    </dialog>

    <script src="practice-content.js"></script>
    <script src="app/data.js"></script>
    <script src="app/dom.js"></script>
    <script src="app/state.js"></script>
    <script src="app/storage.js"></script>
    <script src="app/helpers.js"></script>
    <script src="app/utils/keymap.js"></script>
    <script src="app/utils/finger-map.js"></script>
    <script src="app/views/keyboard-view.js"></script>
    <script src="app/views/practice-view.js"></script>
    <script src="app/views/fingering-view.js"></script>
    <script src="app/views/settings-view.js"></script>
    <script src="app/controllers/practice-controller.js"></script>
    <script src="app/controllers/fingering-draft.js"></script>
    <script src="app/controllers/fingering-controller.js"></script>
    <script src="app/controllers/settings-controller.js"></script>
    <script src="app/controllers/app-runtime.js"></script>
    <script src="app/controllers/app-bootstrap.js"></script>
    <script>
      let keyboardDesignWidth = 0;
      let keyboardDesignHeight = 0;
      let saved = loadSaved();
      initializeAppState(saved);

      const practiceContent = window.PRACTICE_CONTENT || {};

      initializeApp();
    </script>
  </body>
</html>
