<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Редактор раскладок клавиатуры</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --panel: #111;
        --panel-strong: #1a1a1a;
        --key: #111;
        --key-hover: #1a1a1a;
        --key-active: #2a2a2a;
        --line: #444;
        --line-soft: #444;
        --text: #aaa;
        --muted: #cfcfcf;
        --quiet: #999;
        --accent: #ccc;
        --accent-2: #ccc;
        --danger: #ccc;
        --key-height: 84px;
        --key-gap: 12px;
        --arrow-gap: 2px;
        --keyboard-scale: 1;
        --keyboard-stage-height: 0px;
        --keyboard-width: 100%;
        --keyboard-padding: 32px 28px 30px;
        --hand-scale: 0.6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 1180px;
        min-height: 100vh;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "SF Pro Display", "SF Pro Text", "SF Compact Display", "SF Compact Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .app {
        width: min(1920px, 100%);
        margin: 0 auto;
        padding: 28px 34px 36px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .subtitle {
        max-width: 720px;
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.45;
      }

      .page-title {
        margin: 0;
        color: #f0f0f0;
        font-size: 30px;
        font-weight: 800;
        line-height: 1.05;
        letter-spacing: 0;
      }

      .page-title:empty {
        display: none;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .settings-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease, transform 140ms ease;
      }

      .settings-btn:hover {
        background: #1a1a1a;
        color: #fff;
      }

      .settings-btn:active {
        transform: translateY(1px);
      }

      .settings-icon {
        font-size: 23px;
        line-height: 1;
      }

      .toolbar,
      .editor,
      .status {
        display: none !important;
      }

      .segmented,
      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--panel);
      }

      .mode-btn,
      .tool-btn {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 140ms ease, color 140ms ease, transform 140ms ease;
      }

      .mode-btn {
        min-width: 54px;
        padding: 0 14px;
        font-weight: 700;
      }

      .tool-btn {
        min-width: 40px;
        padding: 0 11px;
        font-size: 17px;
      }

      .mode-btn:hover,
      .tool-btn:hover {
        background: #2a2a2a;
        color: var(--text);
      }

      .mode-btn.active,
      .tool-btn.active {
        background: #ccc;
        color: #000;
      }

      .tool-btn:active,
      .mode-btn:active {
        transform: translateY(1px);
      }

      .trainer {
        display: grid;
        gap: 10px;
        margin-bottom: 26px;
      }

      .trainer.hidden {
        display: none;
      }

      .practice-sample,
      .practice-input {
        width: 100%;
        min-height: 58px;
        border: 0;
        background: transparent;
        color: var(--text);
        font-size: 36px;
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: 0;
      }

      .practice-sample {
        display: flex;
        align-items: center;
        color: #d0d0d0;
        border-bottom: 1px solid #2f2f2f;
        white-space: pre;
      }

      .practice-sample-done {
        color: #4f4f4f;
      }

      .practice-sample-current {
        color: #ffffff;
        text-shadow:
          0 0 8px rgb(255 255 255 / 0.2),
          0 0 18px rgb(255 255 255 / 0.08);
      }

      .practice-sample-rest {
        color: var(--text);
      }

      .practice-input {
        border-bottom: 2px solid var(--line);
        color: #f0f0f0;
        outline: 0;
        caret-color: #fff;
      }

      .practice-input:focus {
        border-bottom-color: #bbb;
      }

      .practice-input.error {
        border-bottom-color: #777;
        color: #b8b8b8;
      }

      .settings-dialog {
        width: min(420px, calc(100vw - 40px));
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 0;
      }

      .settings-dialog::backdrop {
        background: rgb(0 0 0 / 0.64);
      }

      .settings-panel {
        display: grid;
        gap: 18px;
        padding: 18px;
      }

      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .settings-head-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .settings-title {
        margin: 0;
        color: #d8d8d8;
        font-size: 18px;
        font-weight: 800;
        line-height: 1;
      }

      .settings-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 7px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 25px;
        line-height: 1;
      }

      .settings-close:hover {
        background: #2a2a2a;
        color: #fff;
      }

      .settings-group {
        display: grid;
        gap: 8px;
      }

      .settings-label {
        color: var(--muted);
        font-size: 13px;
      }

      .module-list {
        display: grid;
        gap: 8px;
      }

      .module-btn {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #111;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
        text-align: left;
        padding: 0 12px;
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
      }

      .module-btn:hover {
        background: #1a1a1a;
        color: #fff;
      }

      .module-btn.active {
        border-color: #ccc;
        background: #ccc;
        color: #000;
      }

      .nav-btn {
        width: 100%;
        min-height: 42px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #111;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
        text-align: left;
        padding: 0 12px;
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
      }

      .nav-btn:hover {
        background: #1a1a1a;
        color: #fff;
      }

      .keyboard-scale {
        position: relative;
        width: 100%;
        height: var(--keyboard-stage-height);
      }

      .keyboard-wrap {
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #111;
        transform: scale(var(--keyboard-scale));
        transform-origin: top left;
      }

      .hands {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .hands.finger-editor-mode {
        pointer-events: auto;
      }

      .hands.finger-editor-mode .finger {
        cursor: pointer;
        pointer-events: visiblePainted;
      }

      .hand {
        position: absolute;
        top: 32.2%;
        width: 28%;
        aspect-ratio: 1;
        --hand-offset-x: 0px;
        --hand-offset-y: 0px;
        transform: translate(var(--hand-offset-x), var(--hand-offset-y)) scale(var(--hand-scale));
        transform-origin: center top;
        transition: transform 0.2s ease;
      }

      .hand.left {
        left: 4.8%;
      }

      .hand.right {
        right: 11.4%;
      }

      .finger {
        display: block;
        position: absolute;
        height: auto;
        opacity: 0.22;
        filter: brightness(1.4);
        pointer-events: none;
        transform: translate(var(--finger-x, 0px), var(--finger-y, 0px));
        user-select: none;
        -webkit-user-drag: none;
        transition: opacity 0.15s ease, filter 0.15s ease;
      }

      .finger.finger-lit {
        opacity: 0.68;
        filter:
          brightness(2.2)
          drop-shadow(0 0 4px rgb(255 255 255 / 0.42))
          drop-shadow(0 0 11px rgb(255 255 255 / 0.2));
      }

      .finger.full {
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .finger.left-thumb {
        left: 37.79%;
        top: 14.41%;
        width: 37.11%;
        height: 46.39%;
      }

      .finger.right-thumb {
        right: 37.79%;
        top: 14.41%;
        width: 37.11%;
        height: 46.39%;
      }

      .finger.left-index {
        left: 23.63%;
        top: 4.67%;
        width: 53.01%;
        height: 91.28%;
      }

      .finger.right-index {
        right: 23.63%;
        top: 4.67%;
        width: 53.01%;
        height: 91.28%;
      }

      .keyboard {
        position: relative;
        z-index: 1;
        display: grid;
        column-gap: 0;
        row-gap: var(--key-gap);
        grid-auto-rows: var(--key-height);
        grid-template-columns: repeat(262, 1fr);
        width: var(--keyboard-width);
        padding: var(--keyboard-padding);
      }

      .keyboard-finger-picker {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 5px;
        z-index: 3;
        display: none;
        height: 34px;
      }

      .keyboard-finger-picker.visible {
        display: block;
      }

      .key {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        height: var(--key-height);
        min-height: 0;
        margin: 0;
        border: 2px solid var(--line);
        border-radius: 8px;
        background: var(--key);
        color: var(--text);
        cursor: pointer;
        user-select: none;
        box-shadow: none;
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }

      .key:hover {
        border-color: var(--line);
        background: var(--key-hover);
      }

      .key.selected {
        border-color: var(--line);
        box-shadow: none;
      }

      .key.key-lit {
        border-color: #b8b8b8;
        background:
          radial-gradient(circle at 50% 50%, rgb(255 255 255 / 0.18), transparent 50%),
          linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
        color: #e8e8e8;
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.16),
          inset 0 0 18px rgb(255 255 255 / 0.07);
      }

      .key.key-lit .label {
        color: #f2f2f2;
        text-shadow: none;
      }

      .key[data-key="space"].key-lit.space-left {
        background:
          radial-gradient(circle at 28% 54%, rgb(255 255 255 / 0.2), transparent 26%),
          linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
      }

      .key[data-key="space"].key-lit.space-right {
        background:
          radial-gradient(circle at 72% 54%, rgb(255 255 255 / 0.2), transparent 26%),
          linear-gradient(180deg, #1c1c1c 0%, #141414 100%);
      }

      .key.key-correct {
        border-color: #98e0ab;
        background:
          radial-gradient(circle at 50% 50%, rgb(104 255 151 / 0.234), transparent 50%),
          linear-gradient(180deg, #1d2a20 0%, #141c15 100%);
        color: #e7ffed;
        box-shadow:
          inset 0 0 0 1px rgb(142 255 173 / 0.208),
          inset 0 0 23px rgb(104 255 151 / 0.091);
      }

      .key.key-correct .label {
        color: #f3fff6;
        text-shadow: none;
      }

      .key.key-wrong {
        border-color: #e09b9b;
        background:
          radial-gradient(circle at 50% 50%, rgb(255 104 104 / 0.234), transparent 50%),
          linear-gradient(180deg, #2a1d1d 0%, #1c1414 100%);
        color: #ffe7e7;
        box-shadow:
          inset 0 0 0 1px rgb(255 142 142 / 0.208),
          inset 0 0 23px rgb(255 104 104 / 0.091);
      }

      .key.key-wrong .label {
        color: #fff1f1;
        text-shadow: none;
      }

      .key.key-finger-map {
        border-color: var(--accent);
        background:
          radial-gradient(circle at 50% 50%, rgb(255 255 255 / 0.16), transparent 56%),
          linear-gradient(180deg, #1b1b1b 0%, #141414 100%);
        color: #f0f0f0;
        box-shadow:
          inset 0 0 0 1px rgb(255 255 255 / 0.12),
          inset 0 0 18px rgb(255 255 255 / 0.06);
      }

      .key.key-finger-map .label {
        color: #fbfbfb;
      }

      .key.home::after {
        content: "";
        position: absolute;
        bottom: 16px;
        left: 50%;
        width: 16px;
        height: 2px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: currentColor;
        opacity: 0.82;
      }

      .label {
        width: 100%;
        padding: 0 8px;
        overflow: hidden;
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 31px;
        font-weight: 400;
        letter-spacing: 0;
      }

      .key.function .label {
        padding: 0 4px;
        color: var(--text);
        font-size: 18px;
        font-weight: 520;
        text-transform: lowercase;
      }

      .key.iso .label {
        white-space: pre-line;
        line-height: 1.58;
      }

      .key.stacked .label {
        white-space: pre-line;
        line-height: 1.66;
        font-size: 24px;
      }

      .key.dim {
        color: var(--quiet);
      }

      .key.align-left {
        align-items: flex-end;
        justify-content: flex-start;
        padding: 0 14px 12px;
      }

      .key.align-left .label {
        text-align: left;
      }

      .key.align-right {
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0 14px 12px;
      }

      .key.align-right .label {
        text-align: right;
      }

      .key[data-key="control"],
      .key[data-key="optionLeft"],
      .key[data-key="commandLeft"],
      .key[data-key="commandRight"],
      .key[data-key="optionRight"] {
        align-items: flex-end;
        padding: 0 12px 12px;
      }

      .key-enter {
        position: relative;
        align-self: stretch;
        height: 100%;
        min-height: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        align-items: flex-end;
        justify-content: flex-end;
        padding: 0;
      }

      .key-enter:hover {
        background: transparent;
      }

      .key-enter.selected {
        box-shadow: none;
      }

      .key-enter svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .key-enter .enter-shape {
        fill: var(--key);
        stroke: var(--line);
        stroke-width: 2.2;
        vector-effect: non-scaling-stroke;
      }

      .key-enter:hover .enter-shape {
        fill: var(--key-hover);
        stroke: var(--line);
      }

      .key-enter.selected .enter-shape {
        stroke: var(--line);
      }

      .key-enter.key-finger-map,
      .key-enter.key-lit,
      .key-enter.key-correct,
      .key-enter.key-wrong {
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .key-enter.key-finger-map .enter-shape {
        fill: #141414;
        stroke: var(--accent);
      }

      .key-enter.key-lit .enter-shape {
        fill: #141414;
        stroke: #b8b8b8;
      }

      .key-enter.key-correct .enter-shape {
        fill: #121812;
        stroke: #8fd3a2;
      }

      .key-enter.key-wrong .enter-shape {
        fill: #181212;
        stroke: #d38f8f;
      }

      .key-enter.key-finger-map .enter-symbol,
      .key-enter.key-lit .enter-symbol,
      .key-enter.key-correct .enter-symbol,
      .key-enter.key-wrong .enter-symbol {
        color: #f0f0f0;
      }

      .key-enter .label {
        position: relative;
        z-index: 1;
        width: auto;
        margin: 0 18px 26px 0;
        padding: 0;
        font-size: 36px;
      }

      .key-enter .enter-symbol {
        position: absolute;
        left: 69%;
        top: 32%;
        z-index: 1;
        color: var(--text);
        font-size: 36px;
        font-weight: 700;
        line-height: 1;
        pointer-events: none;
        transform: translate(-50%, -50%);
      }

      .editor {
        display: grid;
        grid-template-columns: minmax(260px, 1fr) 220px 170px;
        gap: 12px;
        align-items: end;
        margin-top: 18px;
        padding: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--panel);
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .field span {
        color: var(--muted);
        font-size: 13px;
      }

      .field input,
      .field select {
        width: 100%;
        height: 42px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #111;
        color: var(--text);
        padding: 0 12px;
        outline: 0;
      }

      .field input:focus,
      .field select:focus {
        border-color: var(--line);
        box-shadow: none;
      }

      .finger-map-dialog {
        width: min(780px, calc(100vw - 40px));
      }

      .finger-map-layout {
        display: grid;
        gap: 18px;
      }

      .secondary-btn {
        min-height: 42px;
        border: 1px solid var(--line-soft);
        border-radius: 7px;
        background: #111;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
        padding: 0 14px;
        transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
      }

      .secondary-btn:hover {
        background: #1a1a1a;
        color: #fff;
      }

      .secondary-btn.active {
        border-color: var(--accent);
        background: var(--accent);
        color: #000;
      }

      .finger-map-help {
        margin: 0;
        color: var(--quiet);
        font-size: 13px;
        line-height: 1.45;
      }

      .dialog-actions {
        display: flex;
        justify-content: flex-end;
      }

      .finger-map-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
      }

      .finger-map-actions-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 28px;
        flex-wrap: wrap;
      }

      .finger-map-reset {
        justify-self: start;
        text-align: left;
        white-space: nowrap;
      }

      .keyboard-editor-panel {
        display: none;
        gap: 12px;
        margin-top: 14px;
        padding: 14px 16px;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: #101010;
      }

      .keyboard-editor-panel.visible {
        display: grid;
      }

      .keyboard-editor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .keyboard-editor-title {
        color: #f0f0f0;
        font-size: 14px;
        font-weight: 800;
      }

      .keyboard-editor-current {
        color: var(--muted);
        font-size: 13px;
      }

      .finger-picker {
        position: absolute;
        top: 72.7%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border: 1px solid #4e4e4e;
        border-radius: 999px;
        background: transparent;
        color: transparent;
        cursor: pointer;
        padding: 0;
        transform: translate(-50%, -50%);
        transition: border-color 140ms ease, background 140ms ease, transform 140ms ease;
      }

      .finger-picker::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #7b7b7b;
        transition: background 140ms ease, transform 140ms ease;
      }

      .finger-picker:hover {
        border-color: #8c8c8c;
        background: #171717;
      }

      .finger-picker.active {
        border-color: #d6d6d6;
        background: #1f1f1f;
      }

      .finger-picker.active::after {
        background: #f0f0f0;
        transform: scale(1.15);
      }

      .keyboard-editor-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
      }

      .keyboard-editor-actions-right {
        display: flex;
        align-items: center;
        gap: 28px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .keyboard-editor-reset {
        justify-self: start;
        text-align: left;
        white-space: nowrap;
      }

      .ghost-btn {
        min-height: 42px;
        border: 0;
        background: transparent;
        color: var(--quiet);
        cursor: pointer;
        font-weight: 700;
        padding: 0 8px;
        transition: color 140ms ease, opacity 140ms ease;
      }

      .ghost-btn:hover {
        color: #f0f0f0;
      }

      .finger-sync-banner {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid #575757;

      }

      }

      .finger-sync-actions {

        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .finger-map-list {
        display: grid;
        gap: 10px;
      }

      .finger-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line-soft);
        border-radius: 10px;
        background: #0f0f0f;
        transition: border-color 140ms ease, background 140ms ease;
      }

      .finger-card:hover {
        border-color: var(--line);
      }

      .finger-card.active {
        border-color: var(--accent);
        background: #151515;
      }

      .finger-card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .finger-card-btn {
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        font: inherit;
        padding: 0;
        text-align: left;
      }

      .finger-card-name {
        color: #f2f2f2;
        font-size: 15px;
        font-weight: 700;
      }

      .finger-card-meta {
        color: var(--quiet);
        font-size: 12px;
      }

      .finger-key-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .finger-key-chip {
        min-height: 30px;
        border: 1px solid #363636;
        border-radius: 999px;
        background: #171717;
        color: var(--muted);
        font-size: 13px;
        line-height: 1;
        padding: 7px 11px;
        white-space: nowrap;
      }

      .finger-key-chip.empty {
        border-style: dashed;
        color: var(--quiet);
      }

      .finger-key-chip.add-btn {
        border-color: #575757;
        background: #212121;
        color: #f2f2f2;
        cursor: pointer;
        font-weight: 700;
        padding-inline: 12px;
      }

      .finger-key-chip.add-btn:hover {
        border-color: #7a7a7a;
        background: #292929;
      }

      .finger-key-chip.add-input {
        width: 54px;
        min-width: 54px;
        max-width: 54px;
        padding-inline: 0;
        text-align: center;
        outline: 0;
      }

      .finger-key-chip.add-input::placeholder {
        color: #8e8e8e;
      }

      .apply-btn {
        height: 42px;
        border: 0;
        border-radius: 7px;
        background: #ccc;
        color: #000;
        cursor: pointer;
        font-weight: 800;
      }

      .status {
        margin-top: 11px;
        min-height: 20px;
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 1300px) {
        body {
          min-width: 980px;
        }

        .app {
          padding: 20px;
        }

        .topbar {
          justify-content: space-between;
        }

        .controls {
          justify-content: flex-start;
        }

      }

      async function hydrateFingerSvgs() {
        const fingerImages = Array.from(document.querySelectorAll('img.finger[data-finger]'));

        await Promise.all(fingerImages.map(async image => {
          try {
            const response = await fetch(image.getAttribute("src"));
            if (!response.ok) return;

            const svgMarkup = await response.text();
            const parsed = new DOMParser().parseFromString(svgMarkup, "image/svg+xml");
            const svg = parsed.documentElement;
            if (!svg || svg.nodeName.toLowerCase() !== "svg") return;

            svg.setAttribute("class", image.className);
            svg.setAttribute("data-finger", image.dataset.finger || "");
            svg.setAttribute("aria-hidden", "true");
            svg.querySelectorAll("[id]").forEach(node => node.removeAttribute("id"));
            image.replaceWith(svg);
          } catch {
            // Keep raster fallback if inline SVG hydration is unavailable.
          }
        }));

        refreshFingerNodes();
      }

      function cloneFingerMapState(source) {
        return JSON.parse(JSON.stringify(source));
      }

      function openSettingsDraft() {
        draftSettings = {
          language: currentLanguage,
          module: currentPracticeModule
        };
      }

      function currentSettingsDraft() {
        return draftSettings || {
          language: currentLanguage,
          module: currentPracticeModule
        };
      }

      function openFingerMapDraft() {
        draftFingerMap = cloneFingerMapState(fingerMap());
        draftActiveFingerId = activeFingerId;
        addFingerInputId = null;
        pendingFingerSync = null;
        fingerKeyboardMode = false;
      }

      function currentFingerMapState() {
        return draftFingerMap || fingerMap();
      }

      function currentFingerSelection() {
        return (fingerMapDialog.open || fingerKeyboardMode) ? draftActiveFingerId : activeFingerId;
      }

      function keyIds() {
        return geometry.map(([id]) => id);
      }

      function fingerMap() {
        if (!saved.fingerMap || typeof saved.fingerMap !== "object") {
          saved.fingerMap = cloneFingerMapState(defaultFingerMap);
          persist();
        }

        const validKeys = new Set(keyIds());
        fingerIds.forEach(fingerId => {
          if (!Array.isArray(saved.fingerMap[fingerId])) {
            saved.fingerMap[fingerId] = [];
          }
          saved.fingerMap[fingerId] = saved.fingerMap[fingerId].filter((keyId, index, array) => {
            return validKeys.has(keyId) && array.indexOf(keyId) === index;
          });
        });

        keyIds().forEach(keyId => {
          const owner = fingerIds.find(fingerId => saved.fingerMap[fingerId].includes(keyId));
          if (!owner) {
            saved.fingerMap["right-pinky"].push(keyId);
          }
        });

        return saved.fingerMap;
      }

      function fingerName(fingerId, language = currentLanguage) {
        return textFor(language).fingerNames[fingerId] || fingerId;
      }

      function visibleKeyLabel(keyId, language = currentLanguage) {
        const label = labelsFor(language)[keyId] ?? "";
        return label.replace(/\n/g, " ").trim() || keyTitle(keyId);
      }

      function assignKeyToFinger(keyId, fingerId, map = currentFingerMapState()) {
        const copy = map;
        fingerIds.forEach(currentFingerId => {
          copy[currentFingerId] = copy[currentFingerId].filter(mappedKeyId => mappedKeyId !== keyId);
        });
        if (!copy[fingerId].includes(keyId)) {
          copy[fingerId].push(keyId);
        }
      }

      function normalizeFingerKeyInput(value) {
        return value.trim().replace(/\s+/g, " ").toLowerCase();
      }

      function resolveKeyIdFromInput(value) {
        const normalizedValue = normalizeFingerKeyInput(value);
        if (!normalizedValue) return null;

        return keyIds().find(keyId => {
          const variants = new Set([
            visibleKeyLabel(keyId),
            keyTitle(keyId),
            labelsFor(currentLanguage)[keyId] ?? ""
          ]);

          return [...variants].some(variant => normalizeFingerKeyInput(String(variant).replace(/\n/g, " ")) === normalizedValue);
        }) || null;
      }

      function submitFingerKeyInput(fingerId, value) {
        const keyId = resolveKeyIdFromInput(value);
        addFingerInputId = null;

        if (!keyId) {
          renderFingerMapPanel();
          setStatus(textFor().keyNotFound);
          return;
        }

        assignKeyToFinger(keyId, fingerId, currentFingerMapState());
        draftActiveFingerId = fingerId;
        maybeSuggestMirroredFingerKey(fingerId, keyId);
        renderFingerMapPanel();
        renderKeyboard();
        setStatus(textFor().draftKeyAssigned.replace("{key}", visibleKeyLabel(keyId)).replace("{finger}", fingerName(fingerId)));
      }

      function activeFingerKeys() {
        if (!fingerMapDialog.open && !fingerKeyboardMode) {
          return new Set();
        }

        return new Set(currentFingerMapState()[currentFingerSelection()] || []);
      }

      function mirroredFingerId(fingerId) {
        if (fingerId.startsWith("right-")) {
          return fingerId.replace("right-", "left-");
        }

        if (fingerId.startsWith("left-")) {
          return fingerId.replace("left-", "right-");
        }

        return fingerId;
      }

      function maybeSuggestMirroredFingerKey(sourceFingerId, sourceKeyId) {
        const targetFingerId = mirroredFingerId(sourceFingerId);
        const targetKeyId = mirroredKeyIds[sourceKeyId] || null;

        if (!targetKeyId || targetFingerId === sourceFingerId) {
          pendingFingerSync = null;
          return;
        }

        if (currentFingerMapState()[targetFingerId]?.includes(targetKeyId)) {
          pendingFingerSync = null;
          return;
        }

        pendingFingerSync = {
          fingerId: targetFingerId,
          keyId: targetKeyId
        };
      }

      function fingerNodeById(fingerId) {
        return document.querySelector(`.finger[data-finger="${fingerId}"]`);
      }

      function applyHandCalibration() {
        leftHand.style.setProperty("--hand-offset-x", "0px");
        leftHand.style.setProperty("--hand-offset-y", "0px");
        rightHand.style.setProperty("--hand-offset-x", "0px");
        rightHand.style.setProperty("--hand-offset-y", "0px");

        const width = keyboardWrap.offsetWidth || keyboardScale.clientWidth || 0;
        const height = keyboardWrap.offsetHeight || 0;
        if (!width || !height) return;

        rightFingerNodes.forEach(node => {
          const fingerId = node.dataset.finger;
          const fixedEntry = fixedHandCalibrationPx[fingerId] || { x: 0, y: 0 };
          node.style.setProperty("--finger-x", `${fixedEntry.x}px`);
          node.style.setProperty("--finger-y", `${fixedEntry.y}px`);

          const mirroredNode = fingerNodeById(mirroredFingerId(fingerId));
          if (mirroredNode) {
            mirroredNode.style.setProperty("--finger-x", `${-fixedEntry.x}px`);
            mirroredNode.style.setProperty("--finger-y", `${fixedEntry.y}px`);
          }
        });
      }

      function updateFingerHelpText() {
        fingerMapHelp.textContent = fingerKeyboardMode ? textFor().fingerKeyboardHelp : textFor().fingerHelp;
      }

      function renderKeyboardFingerPicker() {
        const positions = {
          "left-pinky": 12.8644,
          "left-ring": 18.3644,
          "left-middle": 24.8644,
          "left-index": 31.5144,
          "left-thumb": 39.5644,
          "right-thumb": 53.8,
          "right-index": 61.85,
          "right-middle": 68.5,
          "right-ring": 75,
          "right-pinky": 80.5
        };

        keyboardFingerPicker.innerHTML = "";
        fingerIds.forEach(fingerId => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `finger-picker${fingerId === currentFingerSelection() ? " active" : ""}`;
          button.dataset.finger = fingerId;
          button.title = fingerName(fingerId);
          button.setAttribute("aria-label", fingerName(fingerId));
          button.style.left = `${positions[fingerId] ?? 50}%`;
          keyboardFingerPicker.append(button);
        });
      }

      function renderKeyboardEditorPanel() {
        const text = textFor();
        keyboardEditorTitle.textContent = "";
        keyboardEditorSave.textContent = text.save;
        keyboardEditorCancel.textContent = text.cancel;
        keyboardEditorReset.textContent = text.restoreDefaults;
        renderKeyboardFingerPicker();
        keyboardFingerPicker.classList.toggle("visible", fingerKeyboardMode);
        keyboardEditorPanel.classList.toggle("visible", fingerKeyboardMode);
        trainer.classList.toggle("hidden", fingerKeyboardMode);
        pageTitle.textContent = fingerKeyboardMode ? text.fingerEditorModeTitle : "";

        if (fingerKeyboardMode) {
          practiceInput.blur();
        }
      }

      function renderFingerSyncBanner() {
        const text = textFor();
        if (!pendingFingerSync) {
          fingerSyncBanner.classList.remove("visible");
          fingerSyncText.textContent = "";
          keyboardEditorSyncBanner.classList.remove("visible");
          keyboardEditorSyncText.textContent = "";
          return;
        }

        const syncText = text.fingerSyncPrompt
          .replace("{key}", visibleKeyLabel(pendingFingerSync.keyId))
          .replace("{finger}", fingerName(pendingFingerSync.fingerId));
        fingerSyncText.textContent = syncText;
        keyboardEditorSyncText.textContent = syncText;
        fingerSyncConfirm.textContent = text.addMirror;
        fingerSyncDismiss.textContent = text.dismissMirror;
        keyboardEditorSyncConfirm.textContent = text.addMirror;
        keyboardEditorSyncDismiss.textContent = text.dismissMirror;
        fingerSyncBanner.classList.toggle("visible", fingerMapDialog.open && !fingerKeyboardMode);
        keyboardEditorSyncBanner.classList.toggle("visible", fingerKeyboardMode);
      }

      function renderFingerMapList() {
        const copy = currentFingerMapState();
        const text = textFor();
        fingerMapList.innerHTML = "";

        fingerIds.forEach(fingerId => {
          const card = document.createElement("section");
          card.className = `finger-card${fingerId === currentFingerSelection() ? " active" : ""}`;

          const head = document.createElement("div");
          head.className = "finger-card-head";

          const choose = document.createElement("button");
          choose.type = "button";
          choose.className = "finger-card-btn";
          choose.addEventListener("click", () => setActiveFinger(fingerId));

          const name = document.createElement("div");
          name.className = "finger-card-name";
          name.textContent = fingerName(fingerId);

          const meta = document.createElement("div");
          meta.className = "finger-card-meta";
          meta.textContent = `${copy[fingerId].length} ${text.keyCount}`;

          choose.append(name, meta);
          head.append(choose);
          card.append(head);

          const keyGrid = document.createElement("div");
          keyGrid.className = "finger-key-grid";

          if (copy[fingerId].length) {
            copy[fingerId].forEach(keyId => {
              const chip = document.createElement("span");
              chip.className = "finger-key-chip";
              chip.textContent = visibleKeyLabel(keyId);
              keyGrid.append(chip);
            });
          } else {
            const chip = document.createElement("span");
            chip.className = "finger-key-chip empty";
            chip.textContent = text.emptyFinger;
            keyGrid.append(chip);
          }

          if (addFingerInputId === fingerId) {
            const input = document.createElement("input");
            input.type = "text";
            input.className = "finger-key-chip add-input";
            input.maxLength = 1;
            input.autocomplete = "off";
            input.addEventListener("keydown", event => {
              if (event.key === "Enter") {
                submitFingerKeyInput(fingerId, input.value);
              } else if (event.key === "Escape") {
                addFingerInputId = null;
                renderFingerMapPanel();
              }
            });
            input.addEventListener("blur", () => {
              if (addFingerInputId === fingerId) {
                submitFingerKeyInput(fingerId, input.value);
              }
            });
            keyGrid.append(input);
            setTimeout(() => input.focus(), 0);
          } else {
            const addButton = document.createElement("button");
            addButton.type = "button";
            addButton.className = "finger-key-chip add-btn";
            addButton.textContent = "+";
            addButton.addEventListener("click", () => {
              addFingerInputId = fingerId;
              renderFingerMapPanel();
            });
            keyGrid.append(addButton);
          }

          card.append(keyGrid);
          fingerMapList.append(card);
        });
      }

      function renderFingerMapPanel() {
        const text = textFor();
        fingerMapTitle.textContent = text.fingerMap;
        fingerMapSectionLabel.textContent = text.fingerMap;
        fingerMapOpen.textContent = text.openFingerMap;
        fingerMapClose.setAttribute("aria-label", text.close);
        fingerMapKeyboardMode.textContent = fingerKeyboardMode ? text.keyboardModeActive : text.keyboardMode;
        fingerMapKeyboardMode.classList.toggle("active", fingerKeyboardMode);
        fingerMapReset.textContent = text.restoreDefaults;
        fingerMapCancel.textContent = text.cancel;
        fingerMapSave.textContent = text.save;
        updateFingerHelpText();
        renderFingerSyncBanner();
        renderFingerMapList();
        renderKeyboardEditorPanel();
      }

      function setActiveFinger(fingerId) {
        if (fingerMapDialog.open) {
          draftActiveFingerId = fingerId;
        } else {
          activeFingerId = fingerId;
          saved.activeFingerId = fingerId;
          persist();
        }
        renderFingerMapPanel();
        renderKeyboard();
      }

      function keyTitle(id) {
        return id.replace(/([A-Z])/g, " $1").replace(/^./, letter => letter.toUpperCase());
      }

      function setStatus(message) {
        status.textContent = message;
        clearTimeout(setStatus.timer);
        setStatus.timer = setTimeout(() => {
          status.textContent = "";
        }, 2600);
      }

      function localizePracticeLine(line, language) {
        const map = practiceCharacterMaps[language];
        if (!map) return line;

        return [...line].map(character => map[character] || character).join("");
      }

      function currentPracticeLines() {
        const module = practiceModules[currentPracticeModule] || practiceModules.module1;
        const localizedLines = localizedPracticeLines[currentPracticeModule]?.[currentLanguage];
        if (localizedLines) return localizedLines;

        return module.lines.map(line => localizePracticeLine(line, currentLanguage));
      }

      function currentPracticeCursor() {
        const expected = currentPracticeLines()[practiceLineIndex] || "";
        const typed = practiceInput.value;
        let index = 0;

        while (index < typed.length && index < expected.length && typed[index] === expected[index]) {
          index += 1;
        }

        return {
          expected,
          typed,
          index,
          character: expected[index] || ""
        };
      }

      function renderPracticeSampleText() {
        const { expected, index } = currentPracticeCursor();
        const doneText = expected.slice(0, index);
        const currentText = expected[index] || "";
        const restText = expected.slice(index + (currentText ? 1 : 0));

        practiceSample.innerHTML = "";

        const done = document.createElement("span");
        done.className = "practice-sample-done";
        done.textContent = doneText;

        const current = document.createElement("span");
        current.className = "practice-sample-current";
        current.textContent = currentText;

        const rest = document.createElement("span");
        rest.className = "practice-sample-rest";
        rest.textContent = restText;

        practiceSample.append(done, current, rest);
      }

      function practiceKeyCandidates(character) {
        if (!character) return [];
        if (character === " ") return ["space"];

        const labels = labelsFor(currentLanguage);
        const candidates = [];

        geometry.forEach(([keyId]) => {
          const rawLabel = labels[keyId] ?? "";
          if (!rawLabel) return;

          const printableSymbols = rawLabel
            .split("\n")
            .map(part => part.trim())
            .filter(part => [...part].length === 1);

          if (!printableSymbols.length) return;

          const variants = new Set();
          printableSymbols.forEach(symbol => {
            variants.add(symbol);
            variants.add(symbol.toLowerCase());
            variants.add(symbol.toUpperCase());
          });

          if (variants.has(character)) {
            candidates.push(keyId);
          }
        });

        return candidates;
      }

      function handForFinger(fingerId) {
        if (!fingerId) return null;
        if (fingerId.startsWith("left-")) return "left";
        if (fingerId.startsWith("right-")) return "right";
        return null;
      }

      function mappedFingerForKey(keyId) {
        const map = currentFingerMapState();
        return fingerIds.find(fingerId => map[fingerId]?.includes(keyId)) || null;
      }

      function practiceTargetForIndex(index) {
        const expected = currentPracticeLines()[practiceLineIndex] || "";
        const character = expected[index] || "";
        const [keyId] = practiceKeyCandidates(character);

        if (!keyId) {
          return { keyId: null, fingerId: null, character, spaceSide: null };
        }

        if (keyId !== "space") {
          return {
            keyId,
            fingerId: mappedFingerForKey(keyId),
            character,
            spaceSide: null
          };
        }

        let previousHand = null;
        for (let previousIndex = index - 1; previousIndex >= 0; previousIndex -= 1) {
          const previousTarget = practiceTargetForIndex(previousIndex);
          previousHand = handForFinger(previousTarget.fingerId);
          if (previousHand) break;
        }

        const nextHand = previousHand === "right" ? "left" : "right";
        return {
          keyId,
          fingerId: `${nextHand}-thumb`,
          character,
          spaceSide: nextHand
        };
      }

      function currentPracticeTarget() {
        const { index } = currentPracticeCursor();
        return practiceTargetForIndex(index);
      }

      function keyIdFromEventCode(code) {
        const directMap = {
          Backquote: "backquote",
          Minus: "minus",
          Equal: "equal",
          BracketLeft: "bracketLeft",
          BracketRight: "bracketRight",
          Backslash: "backslash",
          Semicolon: "semicolon",
          Quote: "quote",
          Comma: "comma",
          Period: "period",
          Slash: "slash",
          Space: "space",
          Enter: "enter",
          Tab: "tab"
        };

        if (directMap[code]) return directMap[code];
        if (code.startsWith("Key")) return code.slice(3).toLowerCase();
        if (code.startsWith("Digit")) return `digit${code.slice(5)}`;
        return null;
      }

      function flashPracticeCorrect(keyId) {
        correctPracticeKeyId = keyId || null;
        renderKeyboard();

        clearTimeout(flashPracticeCorrect.timer);
        flashPracticeCorrect.timer = setTimeout(() => {
          correctPracticeKeyId = null;
          renderKeyboard();
        }, 180);
      }

      function flashPracticeError(keyId) {
        wrongPracticeKeyId = keyId || null;
        correctPracticeKeyId = null;
        practiceInput.classList.add("error");
        renderKeyboard();

        clearTimeout(flashPracticeError.timer);
        flashPracticeError.timer = setTimeout(() => {
          wrongPracticeKeyId = null;
          practiceInput.classList.remove("error");
          renderKeyboard();
        }, 260);
      }

      function renderPracticeGuides() {
        const fingerId = fingerKeyboardMode ? currentFingerSelection() : currentPracticeTarget().fingerId;

        document.querySelectorAll(".finger[data-finger]").forEach(node => {
          node.classList.toggle("finger-lit", node.dataset.finger === fingerId);
        });
      }

      function renderPracticeLine() {
        const lines = currentPracticeLines();
        practiceLineIndex %= lines.length;
        practiceInput.value = "";
        practiceInput.classList.remove("error");
        renderPracticeSampleText();
        renderKeyboard();
      }

      function handlePracticeInput() {
        const expected = currentPracticeLines()[practiceLineIndex];
        const typed = practiceInput.value;
        let index = 0;

        while (index < typed.length && index < expected.length && typed[index] === expected[index]) {
          index += 1;
        }

        if (typed.length > index) {
          const wrongCharacter = typed[index];
          const fallbackWrongKeyId = practiceKeyCandidates(wrongCharacter)[0] || null;
          const wrongKeyId = lastPhysicalPracticeKeyId || fallbackWrongKeyId;

          practiceInput.value = typed.slice(0, index);
          renderPracticeSampleText();
          flashPracticeError(wrongKeyId);
          return;
        }

        if (typed.length > 0 && typed.length > expected.length ? false : typed.length === index && typed.length > 0) {
          const correctKeyId = lastPhysicalPracticeKeyId || practiceTargetForIndex(index - 1).keyId;
          flashPracticeCorrect(correctKeyId);
        }

        wrongPracticeKeyId = null;
        practiceInput.classList.remove("error");
        renderPracticeSampleText();
        renderKeyboard();

        if (practiceInput.value === expected) {
          practiceLineIndex = (practiceLineIndex + 1) % currentPracticeLines().length;
          renderPracticeLine();
        }
      }

      function renderModuleButtons() {
        const settingsState = currentSettingsDraft();
        const selectedModule = practiceModules[settingsState.module] ? settingsState.module : "module1";

        practiceModuleList.innerHTML = "";
        Object.entries(practiceModules).forEach(([id, module]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `module-btn${id === selectedModule ? " active" : ""}`;
          button.textContent = module.name;
          button.addEventListener("click", () => {
            if (draftSettings) {
              draftSettings.module = id;
            }
            renderModuleButtons();
          });
          practiceModuleList.append(button);
        });
      }

      function renderTabs() {
        const text = textFor();
        const settingsState = currentSettingsDraft();
        languageTabs.innerHTML = "";
        Object.entries(languages).forEach(([id, language]) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `mode-btn${id === settingsState.language ? " active" : ""}`;
          button.textContent = language.name;
          button.setAttribute("role", "tab");
          button.setAttribute("aria-selected", String(id === settingsState.language));
          button.addEventListener("click", () => {
            if (draftSettings) {
              draftSettings.language = id;
            }
            renderTabs();
          });
          languageTabs.append(button);
        });
        settingsTitle.textContent = text.settings;
        settingsToggle.setAttribute("aria-label", text.settings);
        settingsClose.setAttribute("aria-label", text.close);
        languageLabel.textContent = text.language;
        moduleLabel.textContent = text.module;
        settingsSave.textContent = text.save;
      }

      function renderKeyboard() {
        const labels = labelsFor(currentLanguage);
        const highlightedKeys = activeFingerKeys();
        const practiceTarget = fingerKeyboardMode ? { keyId: null, spaceSide: null } : currentPracticeTarget();
        handsLayer.classList.toggle("finger-editor-mode", fingerKeyboardMode);
        keyboard.innerHTML = "";
        geometry.forEach(([id, row, column, span, extra = "", rowSpan = 1]) => {
          const key = document.createElement("button");
          const isPracticeKey = practiceTarget.keyId === id;
          const isCorrectPracticeKey = !fingerKeyboardMode && correctPracticeKeyId === id;
          const isWrongPracticeKey = !fingerKeyboardMode && wrongPracticeKeyId === id;
          key.type = "button";
          key.className = `key ${extra}${editMode && id === selectedKey ? " selected" : ""}${highlightedKeys.has(id) ? " key-finger-map" : ""}${isPracticeKey ? " key-lit" : ""}${isCorrectPracticeKey ? " key-correct" : ""}${isWrongPracticeKey ? " key-wrong" : ""}`.trim();
          key.dataset.key = id;
          if (id === "space") {
            key.classList.toggle("space-left", isPracticeKey && practiceTarget.spaceSide === "left");
            key.classList.toggle("space-right", isPracticeKey && practiceTarget.spaceSide === "right");
          }
          key.style.gridColumn = `${column} / span ${span}`;
          key.style.gridRow = `${row} / span ${rowSpan}`;
          if (id === "arrowLeft" || id === "arrowUp" || id === "arrowDown" || id === "arrowRight") {
            key.style.height = "calc((var(--key-height) - var(--arrow-gap)) / 2)";
            key.style.alignSelf = id === "arrowUp" ? "start" : "end";
          }

          if (id === "enter") {
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 100 100");
            svg.setAttribute("preserveAspectRatio", "none");
            svg.setAttribute("aria-hidden", "true");

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("class", "enter-shape");
            path.setAttribute("d", "M7 1 H93 Q99 1 99 7 V93 Q99 99 93 99 H32 Q26 99 26 93 V47 Q26 44 23 44 H7 Q1 44 1 38 V7 Q1 1 7 1 Z");
            svg.append(path);

            const symbol = document.createElement("span");
            symbol.setAttribute("class", "enter-symbol");
            symbol.textContent = labels[id] ?? "";
            key.append(svg);
            key.append(symbol);
          }

          const label = document.createElement("span");
          label.className = "label";
          label.textContent = id === "enter" ? "" : labels[id] ?? "";
          key.append(label);
          key.setAttribute("aria-label", `${keyTitle(id)}: ${labels[id] || "пусто"}`);
          key.addEventListener("click", () => handleKeyboardKeyClick(id));
          keyboard.append(key);
        });
        renderPracticeGuides();
      }

      function handleKeyboardKeyClick(id) {
        if (fingerKeyboardMode) {
          assignKeyToFinger(id, currentFingerSelection(), currentFingerMapState());
          maybeSuggestMirroredFingerKey(currentFingerSelection(), id);
          renderFingerMapPanel();
          renderKeyboard();
          setStatus(textFor().draftKeyAssigned.replace("{key}", visibleKeyLabel(id)).replace("{finger}", fingerName(currentFingerSelection())));
          return;
        }

        selectKey(id);
      }

      function renderSelect() {
        keySelect.innerHTML = "";
        geometry.forEach(([id]) => {
          const option = document.createElement("option");
          option.value = id;
          option.textContent = keyTitle(id);
          keySelect.append(option);
        });
        keySelect.value = selectedKey;
      }

      function selectKey(id) {
        selectedKey = id;
        const labels = labelsFor(currentLanguage);
        keySelect.value = id;
        labelInput.value = labels[id] ?? "";
        renderKeyboard();
        if (editMode) {
          labelInput.focus();
          labelInput.select();
        }
      }

      function applyCurrentLabel() {
        const value = labelInput.value.trim();
        saved[currentLanguage] = saved[currentLanguage] || {};
        const baseValue = languages[currentLanguage].keys[selectedKey] ?? "";

        if (value === baseValue) {
          delete saved[currentLanguage][selectedKey];
        } else {
          saved[currentLanguage][selectedKey] = value;
        }

        persist();
        renderKeyboard();
        setStatus(`Клавиша "${keyTitle(selectedKey)}" обновлена для ${languages[currentLanguage].name}.`);
      }

      function render() {
        renderTabs();
        renderModuleButtons();
        renderPracticeLine();
        renderFingerMapPanel();
        renderKeyboard();
        renderSelect();
        selectKey(selectedKey);
        fitKeyboardScene();
      }

      if (saved.fingers) {
        delete saved.fingers;
        persist();
      }

      function fitKeyboardScene() {
        const availableWidth = keyboardScale.clientWidth;
        if (!availableWidth) return;

        if (!keyboardDesignWidth) {
          keyboardDesignWidth = availableWidth;
          keyboardWrap.style.width = `${keyboardDesignWidth}px`;
          keyboardDesignHeight = keyboardWrap.offsetHeight;
        }

        const scale = availableWidth / keyboardDesignWidth;
        document.documentElement.style.setProperty("--keyboard-scale", String(scale));
        document.documentElement.style.setProperty("--keyboard-stage-height", `${keyboardDesignHeight * scale}px`);
        applyHandCalibration();
      }

      keySelect.addEventListener("change", event => selectKey(event.target.value));
      applyLabel.addEventListener("click", applyCurrentLabel);
      labelInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          applyCurrentLabel();
        }
      });

      editToggle.addEventListener("click", () => {
        editMode = !editMode;
        editToggle.classList.toggle("active", editMode);
        editToggle.setAttribute("aria-pressed", String(editMode));
        document.querySelector(".editor").style.display = editMode ? "grid" : "none";
      });

      resetLayout.addEventListener("click", () => {
        delete saved[currentLanguage];
        persist();
        render();
        setStatus(`Раскладка ${languages[currentLanguage].name} сброшена.`);
      });

      settingsToggle.addEventListener("click", () => {
        openSettingsDraft();
        settingsDialog.showModal();
        renderTabs();
        renderModuleButtons();
      });

      settingsClose.addEventListener("click", () => {
        settingsDialog.close();
      });

      settingsDialog.addEventListener("click", event => {
        if (event.target === settingsDialog) {
          settingsDialog.close();
        }
      });

      settingsDialog.addEventListener("close", () => {
        draftSettings = null;
        practiceInput.focus();
      });

      settingsSave.addEventListener("click", () => {
        const nextSettings = currentSettingsDraft();
        currentLanguage = nextSettings.language;
        currentPracticeModule = nextSettings.module;
        saved.currentLanguage = currentLanguage;
        saved.currentPracticeModule = currentPracticeModule;
        practiceLineIndex = 0;
        persist();
        draftSettings = null;
        render();
        settingsDialog.close();
        setStatus(textFor().settingsSaved);
      });

      fingerMapOpen.addEventListener("click", () => {
        settingsDialog.close();
        openFingerMapDraft();
        fingerMapDialog.showModal();
        renderFingerMapPanel();
        renderKeyboard();
      });

      fingerMapClose.addEventListener("click", () => {
        fingerMapDialog.close();
      });

      fingerMapDialog.addEventListener("click", event => {
        if (event.target === fingerMapDialog) {
          fingerMapDialog.close();
        }
      });

      fingerMapDialog.addEventListener("close", () => {
        addFingerInputId = null;
        if (!fingerKeyboardMode) {
          pendingFingerSync = null;
          draftFingerMap = null;
          draftActiveFingerId = activeFingerId;
        }
        renderFingerMapPanel();
        renderKeyboard();
        practiceInput.focus();
      });

      fingerMapKeyboardMode.addEventListener("click", () => {
        fingerKeyboardMode = true;
        addFingerInputId = null;
        fingerMapDialog.close();
        renderFingerMapPanel();
        renderKeyboard();
      });

      fingerMapCancel.addEventListener("click", () => {
        fingerMapDialog.close();
      });

      fingerMapReset.addEventListener("click", () => {
        pendingFingerSync = null;
        addFingerInputId = null;
        draftFingerMap = cloneFingerMapState(defaultFingerMap);
        draftActiveFingerId = "left-index";
        renderFingerMapPanel();
        renderKeyboard();
        setStatus(textFor().settingsReset);
      });

      fingerMapSave.addEventListener("click", () => {
        activeFingerId = draftActiveFingerId;
        saved.activeFingerId = activeFingerId;
        saved.fingerMap = cloneFingerMapState(currentFingerMapState());
        persist();
        pendingFingerSync = null;
        addFingerInputId = null;
        fingerKeyboardMode = false;
        draftFingerMap = cloneFingerMapState(saved.fingerMap);
        renderFingerMapPanel();
        renderKeyboard();
        fingerMapDialog.close();
        setStatus(textFor().fingerMapSaved);
      });

      keyboardEditorSave.addEventListener("click", () => {
        activeFingerId = draftActiveFingerId;
        saved.activeFingerId = activeFingerId;
        saved.fingerMap = cloneFingerMapState(currentFingerMapState());
        persist();
        pendingFingerSync = null;
        fingerKeyboardMode = false;
        draftFingerMap = null;
        renderFingerMapPanel();
        renderKeyboard();
        setStatus(textFor().fingerMapSaved);
      });

      keyboardEditorCancel.addEventListener("click", () => {
        pendingFingerSync = null;
        fingerKeyboardMode = false;
        draftFingerMap = null;
        draftActiveFingerId = activeFingerId;
        renderFingerMapPanel();
        renderKeyboard();
      });

      keyboardEditorReset.addEventListener("click", () => {
        pendingFingerSync = null;
        draftFingerMap = cloneFingerMapState(defaultFingerMap);
        draftActiveFingerId = "left-index";
        renderFingerMapPanel();
        renderKeyboard();
        setStatus(textFor().settingsReset);
      });

      fingerSyncConfirm.addEventListener("click", () => {
        if (!pendingFingerSync) return;

        const { fingerId, keyId } = pendingFingerSync;
        assignKeyToFinger(keyId, fingerId, currentFingerMapState());
        draftActiveFingerId = fingerId;
        pendingFingerSync = null;
        renderFingerMapPanel();
        renderKeyboard();
        setStatus(textFor().fingerSyncApplied.replace("{key}", visibleKeyLabel(keyId)).replace("{finger}", fingerName(fingerId)));
      });

      fingerSyncDismiss.addEventListener("click", () => {
        pendingFingerSync = null;
        renderFingerMapPanel();
      });

      keyboardEditorSyncConfirm.addEventListener("click", () => {
        if (!pendingFingerSync) return;

        const { fingerId, keyId } = pendingFingerSync;
        assignKeyToFinger(keyId, fingerId, currentFingerMapState());
        draftActiveFingerId = fingerId;
        pendingFingerSync = null;
        renderFingerMapPanel();
        renderKeyboard();
        setStatus(textFor().fingerSyncApplied.replace("{key}", visibleKeyLabel(keyId)).replace("{finger}", fingerName(fingerId)));
      });

      keyboardEditorSyncDismiss.addEventListener("click", () => {
        pendingFingerSync = null;
        renderFingerMapPanel();
      });

      keyboardFingerPicker.addEventListener("click", event => {
        const button = event.target.closest(".finger-picker[data-finger]");
        if (!fingerKeyboardMode || !button) return;
        draftActiveFingerId = button.dataset.finger;
        renderFingerMapPanel();
        renderKeyboard();
      });

      handsLayer.addEventListener("click", event => {
        const fingerNode = event.target.closest(".finger[data-finger]");
        if (!fingerKeyboardMode || !fingerNode) return;
        draftActiveFingerId = fingerNode.dataset.finger;
        renderFingerMapPanel();
        renderKeyboard();
      });

      practiceInput.addEventListener("keydown", event => {
        lastPhysicalPracticeKeyId = keyIdFromEventCode(event.code);
      });
      practiceInput.addEventListener("input", handlePracticeInput);
      hydrateFingerSvgs().finally(() => {
        render();
        practiceInput.focus();
      });
      window.addEventListener("resize", fitKeyboardScene);
    </script>
  </body>
</html>
